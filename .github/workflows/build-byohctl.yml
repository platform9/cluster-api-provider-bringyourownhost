name: Build byohctl

on:
  push:
    branches: [ main ]
    tags: [ 'ci-*' ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'PROJECT'
      - 'SECURITY_CONTACTS'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'PROJECT'
      - 'SECURITY_CONTACTS'

permissions:
  contents: read

jobs:
  build-byohctl:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.2
          cache: true
      - name: Build byohctl binaries
        run: cd cmd/byohctl && make build-all
      - name: Upload byohctl binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: byohctl-binaries
          path: cmd/byohctl/bin/
          retention-days: 1

      - name: Log in to Quay
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/ci-') }}
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Push byohctl binaries
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/ci-') }}
        run: cd cmd/byohctl && make push-byohctl
