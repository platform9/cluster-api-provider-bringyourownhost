name: golangci-lint

on:
  # A stacked pull request targets the branch below it, not main. Filtering on
  # the base left those unlinted while every other workflow ran on them.
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'PROJECT'
      - 'SECURITY_CONTACTS'
  push:
    branches: [ main ]
    # `make ci` pushes a ci-* tag to force every check onto a commit. Lint was
    # the one check that ignored it.
    tags: [ 'ci-*' ]

permissions:
  contents: read

jobs:
  golangci:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2

  check-go-version-consistency:
    name: Go version consistency
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check Go versions match across config files
        run: |
          set -euo pipefail

          GOMOD_VERSION=$(grep '^go ' go.mod | awk '{print $2}')
          TOOL_VERSION=$(grep '^golang ' .tool-versions | awk '{print $2}')

          echo "go.mod:          ${GOMOD_VERSION}"
          echo ".tool-versions:  ${TOOL_VERSION}"

          if [ "$TOOL_VERSION" != "$GOMOD_VERSION" ]; then
            echo "Error: .tool-versions (${TOOL_VERSION}) does not match go.mod (${GOMOD_VERSION})."
            echo "Fix: update .tool-versions to match go.mod."
            exit 1
          fi

          echo "go.mod and .tool-versions have the same Go version: ${GOMOD_VERSION}"
