name: e2e-suite

# push/pull_request triggers disabled while the PICT-driven e2e-matrix.yml
# (workflow_dispatch-gated) is being evaluated as this suite's replacement,
# to stop paying for both on every PR. Still runnable manually via
# workflow_dispatch. Re-add the triggers below if e2e-matrix.yml doesn't
# pan out, or remove this workflow once it's promoted (see the PICT e2e
# refactor plan's PR 9).
on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  e2e:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Wait for controller manager image build
      if: ${{ github.event_name != 'workflow_dispatch' }}
      id: wait
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bash .ci/wait-for-job.sh build-controller-manager.yml build-controller-manager "${{ github.event.pull_request.head.sha || github.sha }}"

    # byohctl's real onboarding flow downloads a published agent .deb bundle from quay.io, tagged
    # to byohctl's own git-describe version -- a tag that only exists there for commits already on
    # main/ci-* (see .github/workflows/build-byohctl.yml). This branch's own bundle, already built by
    # build-agent-bundle.yml for the same commit, lets the byohctl e2e spec
    # (test/e2e/e2e_byohctl_test.go) find it at build/pf9-byohost/debsrc/
    # and serve it from a throwaway local registry itself (ensureLocalAgentBundleRegistry in
    # test/e2e/e2e_agent_bundle_registry.go), rather than skip or depend on a tag that doesn't
    # exist yet for this PR's own code.
    - name: Wait for agent bundle build
      if: ${{ github.event_name != 'workflow_dispatch' }}
      id: wait-bundle
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bash .ci/wait-for-job.sh build-agent-bundle.yml build-agent-bundle "${{ github.event.pull_request.head.sha || github.sha }}"

    - name: Download controller manager image artifact
      if: ${{ github.event_name != 'workflow_dispatch' }}
      uses: actions/download-artifact@v4
      with:
        name: controller-manager-image
        path: .
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ steps.wait.outputs.run_id }}

    - name: Download agent bundle artifact
      if: ${{ github.event_name != 'workflow_dispatch' }}
      uses: actions/download-artifact@v4
      with:
        name: agent-bundle-deb
        path: build/pf9-byohost/debsrc
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ steps.wait-bundle.outputs.run_id }}

    - name: Load controller manager image
      if: ${{ github.event_name != 'workflow_dispatch' }}
      run: |
        docker load -i controller-manager-image.tar
        TAG=$(make tag)
        IMAGE=quay.io/platform9/cluster-api-provider-bringyourownhost/controller-manager
        docker tag "${IMAGE}:${TAG}" "${IMAGE}:dev"

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true

    - name: turn off swap
      run: sudo swapoff -a

    - name: Set netfilter conntrack max
      run: sudo sysctl -w net.netfilter.nf_conntrack_max=131072

    # The byohctl e2e spec serves this branch's own agent bundle from build/pf9-byohost/debsrc/,
    # normally the artifact downloaded above. build-agent-bundle.yml has no workflow_dispatch
    # trigger, so a manually dispatched run has no artifact for its commit and builds the bundle
    # here instead. The spec fails rather than skips in CI, so a missing bundle would fail the run.
    - name: Install fpm build dependencies
      if: ${{ github.event_name == 'workflow_dispatch' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ruby ruby-dev rubygems build-essential
        sudo gem install --no-document fpm

    - name: Build agent .deb bundle from this branch
      if: ${{ github.event_name == 'workflow_dispatch' }}
      run: make build-host-agent-deb

    - name: Run e2e tests
      env:
        SKIP_BUILD: ${{ github.event_name != 'workflow_dispatch' && '1' || '' }}
      run: yes | GINKGO_NODES=3 make test-e2e

    - name: Upload e2e artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-artifacts
        path: _artifacts/
        retention-days: 5

  packaging:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true

    - name: Install rpmbuild
      run: sudo apt-get update && sudo apt-get install -y rpm

    - name: Install fpm build dependencies
      run: |
        sudo apt-get install -y --no-install-recommends ruby ruby-dev rubygems build-essential
        sudo gem install --no-document fpm

    - name: Run packaging tests
      run: make test-packaging

