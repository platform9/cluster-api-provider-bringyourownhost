apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: manager
        image: "{{ .Values.byohImage }}"
        resources:
          limits:
            cpu: "{{ .Values.resources.limits.cpu }}"
            memory: "{{ .Values.resources.limits.memory }}"
          requests:
            cpu: "{{ .Values.resources.requests.cpu }}"
            memory: "{{ .Values.resources.requests.memory }}"
        args:
          - "--metrics-addr=127.0.0.1:8080"
          - "--enable-leader-election"
          - "--byohostagent-heartbeat-timeout={{ .Values.byohostAgentHeartbeatTimeout | default \"120s\" }}"
          - "--bootstrap-apiserver-url={{ required \"bootstrapAPIServerURL is required: the https endpoint a BYO host dials to reach this management cluster\" .Values.bootstrapAPIServerURL }}"
