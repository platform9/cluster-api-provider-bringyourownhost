version: "2"
run:
  timeout: 10m
linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - dogsled
    - dupl
    - dupword
    - errcheck
    - forbidigo
    - funlen
    - goconst
    - gocritic
    - gocyclo
    - goheader
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - misspell
    - mnd
    - nakedret
    - noctx
    - rowserrcheck
    - staticcheck
    - testpackage
    - unconvert
    - unused
    - whitespace
  settings:
    depguard:
      rules:
        main:
          list-mode: lax
          allow:
            - $gostd
            - k8s.io/client-go/plugin/pkg/client/auth
        # Fixes for the HIGH CVEs on this module path only ship as
        # github.com/moby/moby/v2, so .trivyignore suppresses them repo-wide.
        # Test code needs docker to drive real containers; nothing else may.
        docker-engine-modules:
          list-mode: lax
          files:
            - "!$test"
            - "!**/test/e2e/**"
          deny:
            - pkg: github.com/docker/docker/
              desc: unfixable HIGH CVEs on this module path; e2e tests only
            - pkg: github.com/docker/cli/
              desc: removed to clear CVE-2025-15558; do not reintroduce
    dupl:
      threshold: 200
    forbidigo:
      # Match the resolved symbol, not the source text, so an aliased import
      # is caught too.
      analyze-types: true
      forbid:
        - pattern: ^context\.TODO$
          pkg: ^context$
          msg: take the context from the caller instead of starting a new one
    funlen:
      lines: 100
      statements: 50
    goconst:
      min-len: 2
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
        # This repo only ever targets Linux (host agent runs on Linux hosts,
        # controller manager runs in Linux containers) - filepathJoin's
        # Windows-separator-portability concern doesn't apply, and forcing
        # every path literal into single-segment filepath.Join args makes
        # them harder to read for a benefit this project can't use.
        - filepathJoin
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 18
    goheader:
      values:
        const:
          LICENSE: Apache-2.0
        regexp:
          YEAR: 20\d*-*\d*
          COMPANY: (VMware|Platform9), Inc\.
          PLATFORM9-COPYRIGHT: (Copyright 20\d*-*\d* Platform9, Inc\. All Rights Reserved\.\n)?
      template: |-
        Copyright {{ YEAR }} {{ COMPANY }} All Rights Reserved.
        {{ PLATFORM9-COPYRIGHT }}SPDX-License-Identifier: {{ LICENSE }}
    govet:
      enable:
        - shadow
    gosec:
      excludes:
        - G115
    misspell:
      locale: US
    mnd:
      checks:
        - argument
        - case
        - condition
        - return
      ignored-functions:
        - log.*
      ignored-numbers:
        - "2"
    nolintlint:
      require-explanation: false
      require-specific: false
      allow-unused: false
    whitespace:
      multi-func: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - gosec
          - goconst # don't make me obfuscate three word constants like "rpm"
        path: _test\.go
      # New files added since the fork from vmware-tanzu don't carry (and
      # shouldn't fabricate) a VMware copyright header.
      - linters:
          - goheader
        path: installer/internal/algo/common_ubuntu_test\.go$
    paths:
      - .*dummy.go
      - .*fakes/
      - third_party$
      - builtin$
      - examples$
formatters:
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/vmware-tanzu
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
